<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banco de Imagens — M. Ferretti</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --azul:#0d3b66;
    --azul-claro:#1d5d99;
    --cinza:#f2f4f7;
    --borda:#e1e5ea;
    --texto:#1c2733;
    --suave:#6b7785;
    --amarelo:#ffd23f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--cinza);
    color:var(--texto);
  }
  header{
    background:linear-gradient(135deg,var(--azul),var(--azul-claro));
    color:#fff;
    padding:24px 20px 20px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  .header-top{
    max-width:1200px;margin:0 auto;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .header-top{gap:18px}
  .logo-img{height:46px;width:auto;display:block;flex:0 0 auto}
  .titulo{flex:0 1 auto}
  .titulo h1{font-size:clamp(26px,4vw,46px);font-weight:800;line-height:1.05;text-align:left;letter-spacing:2px}
  .controles{max-width:1200px;margin:18px auto 0;display:flex;flex-wrap:wrap;gap:10px}
  .busca-wrap{position:relative;flex:1 1 260px}
  #busca{
    width:100%;padding:13px 44px 13px 16px;border:none;border-radius:10px;
    font-size:16px;outline:none;box-shadow:0 2px 8px rgba(0,0,0,.12);
  }
  .busca-wrap svg{
    position:absolute;right:14px;top:50%;transform:translateY(-50%);
    width:20px;height:20px;fill:var(--suave);pointer-events:none;
  }
  .filtro{
    flex:0 1 220px;padding:13px 14px;border:none;border-radius:10px;
    font-size:15px;outline:none;box-shadow:0 2px 8px rgba(0,0,0,.12);
    background:#fff;color:var(--texto);cursor:pointer;
  }
  main{max-width:1200px;margin:0 auto;padding:22px 20px 60px}
  .barra-info{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .contador{font-size:13px;color:var(--suave)}
  .limpar{font-size:13px;color:var(--azul-claro);background:none;border:none;cursor:pointer;text-decoration:underline}
  .grid{
    display:grid;gap:18px;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  }
  .card{
    background:#fff;border:1px solid var(--borda);border-radius:14px;
    overflow:hidden;display:flex;flex-direction:column;
    transition:transform .12s ease,box-shadow .12s ease;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(13,59,102,.12)}
  .img-box{
    aspect-ratio:1/1;background:#fafbfc;display:flex;align-items:center;justify-content:center;
    border-bottom:1px solid var(--borda);overflow:hidden;cursor:zoom-in;position:relative;
  }
  .img-box img{width:100%;height:100%;object-fit:contain}
  .sem-img{color:var(--suave);font-size:13px;text-align:center;padding:10px}
  .marca-badge{
    position:absolute;top:8px;left:8px;background:var(--azul);color:#fff;
    font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.3px;
  }
  .info{padding:12px 14px;flex:1;display:flex;flex-direction:column;gap:5px}
  .cod{font-size:12px;font-weight:700;color:var(--azul-claro);letter-spacing:.3px}
  .desc{font-size:14px;font-weight:600;line-height:1.25;flex:1}
  .ean{font-size:12px;color:var(--suave);font-variant-numeric:tabular-nums}
  .meta{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:11.5px;color:var(--suave);font-variant-numeric:tabular-nums}
  .meta b{color:var(--texto);font-weight:700}
  .meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* card selecionado (via lista de selecao) */
  .card.sel{outline:3px solid var(--azul);outline-offset:-1px;box-shadow:0 6px 18px rgba(13,59,102,.22)}
  /* botao + painel da lista de selecao */
  .sel-wrap-btn{position:relative;flex:0 1 auto}
  .sel-btn{cursor:pointer;white-space:nowrap}
  .painel-sel{
    position:absolute;top:calc(100% + 6px);right:0;width:min(380px,90vw);
    background:#fff;border:1px solid var(--borda);border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:45;display:none;overflow:hidden;
  }
  .painel-sel.open{display:block}
  .painel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:10px 12px;border-bottom:1px solid var(--borda);background:var(--cinza)}
  .painel-head strong{font-size:13px;color:var(--texto)}
  .painel-acts button{font-size:12px;border:none;background:var(--azul);color:#fff;border-radius:6px;padding:4px 8px;cursor:pointer;margin-left:5px}
  .painel-acts button:hover{background:var(--azul-claro)}
  .painel-lista{max-height:48vh;overflow:auto;padding:4px 0}
  .item-sel{display:flex;align-items:center;gap:8px;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--texto)}
  .item-sel:hover{background:#eef3f9}
  .item-sel input{width:17px;height:17px;accent-color:var(--azul);cursor:pointer;flex:0 0 auto}
  .item-sel .is-cod{font-weight:700;color:var(--azul-claro);font-size:12px;flex:0 0 auto;min-width:96px}
  .item-sel .is-desc{color:var(--suave);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .painel-vazio{padding:18px 14px;color:var(--suave);font-size:13px;text-align:center}
  /* selo discreto: data dos dados */
  .dados-version{
    position:fixed;right:12px;bottom:10px;z-index:30;
    background:rgba(13,59,102,.85);color:#fff;font-size:11px;
    padding:5px 10px;border-radius:20px;box-shadow:0 2px 8px rgba(0,0,0,.25);
    pointer-events:none;backdrop-filter:saturate(120%);
  }
  @media print{ .dados-version{display:none} }
  /* Separador de marca (logo uma vez por grupo) */
  .marca-sep{
    grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:#fff;border:1px solid var(--borda);border-radius:12px;padding:10px 16px;
  }
  .marca-sep-in{display:flex;align-items:center;gap:12px;min-width:0}
  .marca-logo{height:216px;width:auto;max-width:780px;object-fit:contain;display:block}
  .marca-cod{font-size:12px;font-weight:700;color:var(--suave);letter-spacing:.5px;background:var(--cinza);padding:3px 8px;border-radius:6px;flex:0 0 auto}
  .marca-dl{color:var(--suave);opacity:.5;display:inline-flex;align-items:center;gap:5px;text-decoration:none;font-size:12px;flex:0 0 auto;transition:opacity .12s,color .12s}
  .marca-dl:hover{opacity:1;color:var(--azul)}
  .marca-dl svg{width:16px;height:16px;fill:currentColor}
  .baixar{
    margin:0 14px 8px;padding:10px;border:none;border-radius:9px;cursor:pointer;
    background:var(--azul);color:#fff;font-size:14px;font-weight:600;
    display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;
    transition:background .12s ease;
  }
  .baixar:hover{background:var(--azul-claro)}
  .baixar.disabled{background:#c7ccd2;cursor:not-allowed;pointer-events:none}
  .baixar svg{width:16px;height:16px;fill:#fff}
  .vazio{text-align:center;color:var(--suave);padding:60px 20px;font-size:15px}
  /* Botao dados cadastrais */
  .dados-btn{
    margin:0 14px 14px;padding:9px;border:1px solid var(--azul);border-radius:9px;cursor:pointer;
    background:#fff;color:var(--azul);font-size:13px;font-weight:600;
    display:flex;align-items:center;justify-content:center;gap:7px;transition:background .12s ease;
  }
  .dados-btn:hover{background:#eef3f9}
  .dados-btn svg{width:15px;height:15px;fill:var(--azul)}
  /* Modal dados cadastrais (layout igual ao site de cadastro) */
  #dadosModal{position:fixed;inset:0;background:rgba(10,20,30,.55);display:none;z-index:60;overflow:auto;padding:24px 14px}
  #dadosModal.open{display:block}
  .dc-wrap{max-width:760px;margin:0 auto}
  .dc-close{position:sticky;top:0;display:flex;justify-content:flex-end;margin-bottom:8px}
  .dc-close button{background:#fff;border:none;border-radius:50%;width:38px;height:38px;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2);color:var(--texto)}
  .dc-card{background:#fff;border-radius:12px;box-shadow:0 6px 30px rgba(0,0,0,.25);overflow:hidden;border:1px solid var(--borda)}
  .dc-top{background:var(--azul);color:#fff;padding:12px 16px}
  .dc-top .dc-cod{font-size:.76rem;opacity:.85;letter-spacing:.5px}
  .dc-top .dc-desc{font-size:1.1rem;font-weight:700;line-height:1.2;margin-top:2px}
  .dc-top .dc-marca{display:inline-block;margin-top:6px;background:rgba(255,255,255,.2);padding:2px 9px;border-radius:20px;font-size:.76rem;font-weight:600}
  .dc-bloco{padding:9px 16px;border-top:1px solid var(--borda)}
  .dc-bloco h3{font-size:.7rem;text-transform:uppercase;letter-spacing:.6px;color:var(--azul);margin-bottom:6px;font-weight:700}
  .dc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px}
  .dc-grid.full{grid-template-columns:1fr}
  .dc-campo .dc-rotulo{font-size:.68rem;color:var(--suave);text-transform:uppercase;letter-spacing:.2px}
  .dc-campo .dc-valor{font-size:.95rem;font-weight:600;line-height:1.2;word-break:break-word}
  .dc-campo .dc-valor.vazio{color:#aab;font-weight:400}
  .dc-indisp{padding:40px 20px;text-align:center;color:var(--suave)}
  /* Botoes de exportacao */
  .acoes-dir{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .export-btn{padding:8px 12px;border:none;border-radius:8px;background:var(--azul);color:#fff;font-size:13px;font-weight:600;cursor:pointer}
  .export-btn:hover{background:var(--azul-claro)}
  .export-btn.alt{background:#e6007e}
  .export-btn.alt:hover{background:#b8005f}
  .sel-info{font-size:12px;color:var(--azul);font-weight:700}
  /* Areas de impressao (PDF) — escondidas na tela */
  #printArea, #apresArea{display:none}
  @media print{
    body>header, body>main, body>footer, #dadosModal, #lightbox{display:none !important}
    #printArea, #apresArea{display:none !important}
    body.modo-cad #printArea{display:block !important}
    body.modo-apres #apresArea{display:block !important}
    @page{size:A4 portrait;margin:6mm}
    /* cabecalho enxuto no topo da 1a pagina (nao gera pagina propria) */
    #printArea .ph{text-align:center;font-size:7.5pt;color:#333;margin:0 0 2mm 0;font-weight:600}
    /* 2 por folha: cada cadastro ocupa ~40% da folha (altura fixa) */
    #printArea .dc-card{
      box-shadow:none;border:1px solid #8a90a6;border-radius:7px;margin:0 0 6mm 0;
      height:119mm;overflow:hidden;
      break-inside:avoid;page-break-inside:avoid;display:flex;flex-direction:column;
    }
    #printArea .dc-card:nth-of-type(2n){page-break-after:always;margin-bottom:0}
    #printArea .dc-top{padding:4px 9px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    #printArea .dc-top .dc-cod{font-size:6.5pt}
    #printArea .dc-top .dc-desc{font-size:9.5pt;line-height:1.1;margin-top:1px}
    #printArea .dc-top .dc-marca{font-size:6.5pt;margin-top:2px;padding:1px 6px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    #printArea .dc-bloco{padding:2px 9px}
    #printArea .dc-bloco h3{font-size:6.3pt;margin-bottom:1px;letter-spacing:.4px}
    /* 3 colunas para caber TODOS os campos em meia folha */
    #printArea .dc-grid{grid-template-columns:repeat(3,1fr);gap:0 10px}
    #printArea .dc-grid.full{grid-template-columns:1fr}
    #printArea .dc-campo{margin-bottom:1px}
    #printArea .dc-campo .dc-rotulo{font-size:6pt;letter-spacing:.1px;line-height:1.05}
    #printArea .dc-campo .dc-valor{font-size:7.6pt;line-height:1.1}

    /* ===== PDF APRESENTAÇÃO (layout aprovado Baruel/Linha Baby) ===== */
    @page apresFull{size:A4 portrait;margin:0}
    body.modo-apres #apresArea, body.modo-apres #apresArea *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .ax-page{page:apresFull;position:relative;width:210mm;height:297mm;overflow:hidden;background-size:cover;background-position:center;background-repeat:no-repeat;page-break-after:always;break-after:page}
    .ax-page:last-child{page-break-after:auto}
    .ax-body{position:relative;height:297mm;display:flex;flex-direction:column;padding:6.5mm 6.5mm 4mm}
    .ax-header{display:flex;align-items:center;gap:3mm;flex:0 0 auto}
    .ax-hcell{flex:0 0 40mm;display:flex;align-items:center}
    .ax-hcell.right{justify-content:flex-end}
    .ax-mlogo{height:18mm;max-width:40mm;object-fit:contain}
    .ax-flogo{height:9mm;max-width:38mm;object-fit:contain}
    .ax-headline{flex:1;text-align:center}
    .ax-kicker{font-size:7pt;color:var(--ax-kicker);letter-spacing:3px;font-weight:600;text-transform:uppercase}
    .ax-linha{font-size:22pt;font-weight:900;color:var(--ax-dark);letter-spacing:.5px;line-height:1.05}
    .ax-divider{height:2px;background:linear-gradient(90deg,transparent,var(--ax-accent) 18%,var(--ax-accent) 82%,transparent);margin:2.4mm 0 1.6mm;border-radius:2px;flex:0 0 auto}
    .ax-grid{flex:1 1 auto;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:1mm 2.5mm;min-height:0}
    .ax-tile{display:flex;flex-direction:column;min-height:0}
    .ax-photo{flex:1 1 auto;width:100%;display:flex;align-items:flex-end;justify-content:center;min-height:0}
    .ax-photo img{max-width:92%;max-height:80%;object-fit:contain;filter:drop-shadow(0 3px 5px rgba(30,90,140,0.30))}
    .ax-photo.sem{align-items:center}
    .ax-photo.sem::after{content:'sem imagem';font-size:7pt;color:#aac;font-style:italic}
    .ax-info{width:100%;flex:0 0 auto;text-align:center;margin-top:1mm}
    .ax-desc{font-size:9pt;font-weight:800;color:var(--ax-dark);line-height:1.16;margin-bottom:.8mm;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:8mm}
    .ax-cod{font-size:7pt;color:var(--ax-dark);font-family:Consolas,monospace;margin-bottom:1.4mm}
    .ax-dados{display:flex;flex-wrap:wrap;justify-content:center;gap:1.2mm 1.4mm}
    .ax-dados span{display:inline-flex;align-items:baseline;gap:1.2mm;background:linear-gradient(180deg,#fff,var(--ax-chipbg));border:1.6px solid var(--ax-border);border-radius:999px;padding:.7mm 2.6mm;font-size:8pt;color:var(--ax-val);font-weight:700;box-shadow:0 1px 2px rgba(45,120,180,0.20),inset 0 1px 0 rgba(255,255,255,.9);font-variant-numeric:tabular-nums;white-space:nowrap}
    .ax-dados b{color:var(--ax-label);font-weight:800;font-size:6.2pt;letter-spacing:.4px;text-transform:uppercase}
    .ax-footer{display:flex;justify-content:space-between;align-items:center;padding-top:1.4mm;margin-top:1.4mm;border-top:1px solid var(--ax-border);font-size:6.5pt;color:var(--ax-footer);letter-spacing:.3px;flex:0 0 auto}
  }
  /* overlay "gerando catalogo" (na tela) */
  #apresLoad{position:fixed;inset:0;background:rgba(13,59,102,.55);display:none;align-items:center;justify-content:center;z-index:60}
  #apresLoad.on{display:flex}
  #apresLoad div{background:#fff;padding:20px 28px;border-radius:12px;font:600 15px "Segoe UI";color:#0d3b66;box-shadow:0 10px 30px rgba(0,0,0,.3)}
  /* Lightbox */
  #lightbox{
    position:fixed;inset:0;background:rgba(10,20,30,.9);display:none;
    align-items:center;justify-content:center;z-index:50;padding:20px;cursor:zoom-out;
  }
  #lightbox img{max-width:92vw;max-height:82vh;object-fit:contain;border-radius:8px;background:#fff}
  #lightbox .lb-bar{position:absolute;bottom:24px;display:flex;gap:12px}
  #lightbox .lb-bar a{
    background:var(--azul);color:#fff;text-decoration:none;padding:10px 18px;border-radius:9px;
    font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;
  }
  #lightbox .lb-bar a svg{width:16px;height:16px;fill:#fff}
  footer{text-align:center;color:var(--suave);font-size:12px;padding:24px}
</style>
</head>
<body>
<header>
  <div class="header-top">
    <img class="logo-img" src="logo-ferretti.png" alt="Ferretti distribuidora">
    <div class="titulo">
      <h1>CATÁLOGO VIRTUAL</h1>
    </div>
  </div>
  <div class="controles">
    <div class="busca-wrap">
      <input id="busca" type="search" placeholder="Pesquisar por código, descrição ou EAN..." autocomplete="off">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
    </div>
    <select id="filtroMarca" class="filtro"><option value="">Todas as marcas</option></select>
    <div class="sel-wrap-btn">
      <button type="button" class="filtro sel-btn" id="btnSelProdutos">☑ Selecionar produtos<span id="selBtnCount"></span></button>
      <div class="painel-sel" id="painelSel">
        <div class="painel-head">
          <strong>Selecionar para exportar</strong>
          <span class="painel-acts">
            <button type="button" id="selTodos">Marcar todos</button>
            <button type="button" id="selNenhum">Limpar</button>
          </span>
        </div>
        <div class="painel-lista" id="listaSel"></div>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="barra-info">
    <span class="contador" id="contador"></span>
    <div class="acoes-dir">
      <span class="sel-info" id="selInfo"></span>
      <button class="limpar" id="limparSel" style="display:none">Limpar seleção</button>
      <button class="export-btn alt" id="btnApres" type="button">🖼️ PDF Apresentação</button>
      <button class="export-btn" id="btnPdf" type="button">📄 PDF Cadastral</button>
      <button class="export-btn" id="btnXlsx" type="button">📊 XLSX</button>
      <button class="limpar" id="limpar" style="display:none">Limpar filtros</button>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="vazio" id="vazio" style="display:none">Nenhum produto encontrado.</div>
</main>

<div id="printArea"></div>
<div id="apresArea"></div>
<div id="apresLoad"><div>Gerando catálogo… aguarde</div></div>

<div id="dadosModal">
  <div class="dc-wrap">
    <div class="dc-close"><button type="button" id="dcFechar" aria-label="Fechar">&times;</button></div>
    <div id="dcConteudo"></div>
  </div>
</div>

<div id="lightbox">
  <img id="lb-img" src="" alt="">
  <div class="lb-bar">
    <a id="lb-baixar" href="#" download>
      <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      Baixar imagem
    </a>
  </div>
</div>

<div class="dados-version" id="dadosVersao"></div>
<footer>M. Ferretti · Catálogo Virtual</footer>

<script src="produtos.js"></script>
<script src="cadastro.js"></script>
<script src="imagens-manifest.js"></script>
<script src="dados-version.js"></script>
<script>
  // Extensões tentadas para cada imagem (a foto é nomeada pelo CÓDIGO do produto)
  var EXTENSOES = ["jpg","jpeg","png","webp"];
  var PASTA = "imagens/";
  // Manifesto das imagens existentes (codigo -> extensao), gerado no publish.
  var DISP = (typeof IMAGENS_DISP !== "undefined" && IMAGENS_DISP) ? IMAGENS_DISP : null;
  function extDe(codigo){ return (DISP && DISP[codigo]) ? DISP[codigo] : "png"; }

  var grid = document.getElementById("grid");
  var vazio = document.getElementById("vazio");
  var contador = document.getElementById("contador");
  var busca = document.getElementById("busca");
  var selMarca = document.getElementById("filtroMarca");
  var btnLimpar = document.getElementById("limpar");
  var lightbox = document.getElementById("lightbox");
  var lbImg = document.getElementById("lb-img");
  var lbBaixar = document.getElementById("lb-baixar");

  var selecionados = {};  // codigos marcados para exportar

  function normaliza(s){
    return (s || "").toString().toLowerCase()
      .normalize("NFD").replace(/[̀-ͯ]/g,"");
  }

  // Tenta carregar a imagem testando cada extensão; ao achar, atualiza card e download.
  function resolveImagem(card, codigo){
    var imgBox = card.querySelector(".img-box");
    var img = imgBox.querySelector("img");
    var botao = card.querySelector(".baixar");
    // Se o manifesto sabe a extensao, usa direto (sem testar todas).
    if(DISP && DISP[codigo]){
      var u = PASTA + codigo + "." + DISP[codigo];

  function _hx(h){ h=h.replace('#',''); return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]; }
  function _hex(r,g,b){ function c(x){ x=Math.max(0,Math.min(255,Math.round(x))); return ('0'+x.toString(16)).slice(-2);} return '#'+c(r)+c(g)+c(b); }
  function _dark(h,f){ var c=_hx(h); return _hex(c[0]*f,c[1]*f,c[2]*f); }
  function _mixW(h,t){ var c=_hx(h); return _hex(c[0]+(255-c[0])*t,c[1]+(255-c[1])*t,c[2]+(255-c[2])*t); }

    return {
      accent:accent, dark:dark,
      border:_dark(base,0.82), chipbg:_mixW(base,0.86),
      label:_dark(base,0.58), val:dark,
      kicker:_mixW(dark,0.30), footer:_mixW(dark,0.42),
      pageBg:_mixW(base,0.90)
    };
  }

  // ---- imagens (canvas): remove fundo branco + recorta ----
  var _imgCache = {};
  function loadImage(src){ return new Promise(function(res){ var i=new Image(); i.crossOrigin='anonymous'; i.onload=function(){res(i);}; i.onerror=function(){res(null);}; i.src=src; }); }
  function removeBgTrim(img){
    var w=img.naturalWidth, h=img.naturalHeight;
    if(!w||!h) return '';
    var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    var ctx=cv.getContext('2d'); ctx.drawImage(img,0,0);
    var id; try{ id=ctx.getImageData(0,0,w,h); }catch(e){ return ''; }
    var d=id.data, thr=238, soft=205, N=w*h;
    var vis=new Uint8Array(N), stack=[];
    for(var x=0;x<w;x++){ stack.push(x); stack.push((h-1)*w+x); }
    for(var y=0;y<h;y++){ stack.push(y*w); stack.push(y*w+(w-1)); }
    while(stack.length){
      var idx=stack.pop(); if(vis[idx])continue; vis[idx]=1; var o=idx*4;
      if(!(d[o]>=thr&&d[o+1]>=thr&&d[o+2]>=thr))continue;
      d[o+3]=0; var px=idx%w, py=(idx/w)|0, n;
      if(px>0){ n=idx-1; if(!vis[n])stack.push(n);} if(px<w-1){ n=idx+1; if(!vis[n])stack.push(n);}
      if(py>0){ n=idx-w; if(!vis[n])stack.push(n);} if(py<h-1){ n=idx+w; if(!vis[n])stack.push(n);}
    }
    for(var i=0;i<N;i++){ var oo=i*4; if(d[oo+3]===0)continue;
      var mn=Math.min(d[oo],d[oo+1],d[oo+2]);
      if(mn>=soft){ var adj=false, nb=[i-1,i+1,i-w,i+w];
        for(var k=0;k<4;k++){ var nn=nb[k]; if(nn>=0&&nn<N&&d[nn*4+3]===0){adj=true;break;} }
        if(adj){ var a=Math.round(255*(255-mn)/(255-soft)); d[oo+3]=Math.max(0,Math.min(255,a)); }
      }
    }
    ctx.putImageData(id,0,0);
    var minX=w,minY=h,maxX=-1,maxY=-1;
    for(var yy=0;yy<h;yy++){ for(var xx=0;xx<w;xx++){ if(d[(yy*w+xx)*4+3]>12){ if(xx<minX)minX=xx; if(xx>maxX)maxX=xx; if(yy<minY)minY=yy; if(yy>maxY)maxY=yy; } } }
    if(maxX<0) return '';
    var pad=Math.round(Math.max(w,h)*0.01);
    minX=Math.max(0,minX-pad); minY=Math.max(0,minY-pad); maxX=Math.min(w-1,maxX+pad); maxY=Math.min(h-1,maxY+pad);
    var cw=maxX-minX+1, ch=maxY-minY+1;
    var cv2=document.createElement('canvas'); cv2.width=cw; cv2.height=ch;
    cv2.getContext('2d').drawImage(cv,minX,minY,cw,ch,0,0,cw,ch);
    return cv2.toDataURL('image/png');
  }
  function prepImg(src){ return new Promise(function(res){
    if(_imgCache[src]!==undefined){ res(_imgCache[src]); return; }
    loadImage(src).then(function(img){ var r = img ? removeBgTrim(img) : ''; _imgCache[src]=r; res(r); });
  }); }
  function sampleAccent(img){
    var tw=90, th=Math.max(1,Math.round(img.naturalHeight*90/img.naturalWidth));
    var cv=document.createElement('canvas'); cv.width=tw; cv.height=th;
    var ctx=cv.getContext('2d'); ctx.drawImage(img,0,0,tw,th);
    var d; try{ d=ctx.getImageData(0,0,tw,th).data; }catch(e){ return ''; }
    var sr=0,sg=0,sb=0,cnt=0,dr=0,dg=0,db=0,dc=0;
    for(var i=0;i<tw*th;i++){ var o=i*4,r=d[o],g=d[o+1],b=d[o+2];
      var mx=Math.max(r,g,b),mn=Math.min(r,g,b),v=mx/255,s=mx===0?0:(mx-mn)/mx;
      if(s>0.20&&v>0.18&&v<0.97){ sr+=r;sg+=g;sb+=b;cnt++; }
      if(v<0.6){ dr+=r;dg+=g;db+=b;dc++; }
    }
    if(cnt>=20) return _hex(sr/cnt,sg/cnt,sb/cnt);
    if(dc>0)    return _hex(dr/dc,dg/dc,db/dc);
    return '';
  }
  function accentPalette(bgUrl,m){ return new Promise(function(res){
    if(bgUrl){ loadImage(bgUrl).then(function(bi){ var base = bi ? (sampleAccent(bi)||'') : ''; res(buildPalette(base || corMarca(m))); }); }
    else { res(buildPalette(corMarca(m))); }
  }); }

  async function exportarApresentacao(){
    var alvo = alvoExport();
    if(!alvo.length){ alert('Selecione produtos ou ajuste o filtro para a apresentação.'); return; }
    var load = document.getElementById('apresLoad'); load.classList.add('on');
    try{
      var grupos = {}, ordem = [];
      alvo.forEach(function(p){ if(!grupos[p.marca]){ grupos[p.marca]=[]; ordem.push(p.marca); } grupos[p.marca].push(p); });

      var html = '';
      for(var gi=0; gi<ordem.length; gi++){
        var m = ordem[gi];
        var bgUrl = APRES_BG[m] || '';
        var linha = APRES_LINHA[m] || nomeMarca(m);
        var pal = await accentPalette(bgUrl, m);
        var mlogoSrc = MARCA_LOGO[m] ? await prepImg(MARCA_LOGO[m]) : '';
        var mlogoHtml = mlogoSrc ? '<img class="ax-mlogo" src="'+mlogoSrc+'" alt="">' : '<span class="ax-linha" style="font-size:13pt">'+nomeMarca(m)+'</span>';
        var todos = grupos[m];
        var totalPags = Math.ceil(todos.length/8);

        for(var pi=0; pi<todos.length; pi+=8){
          var pagina = todos.slice(pi, pi+8);
          var pNum = Math.floor(pi/8)+1;
          var tiles = '';
          for(var ti=0; ti<pagina.length; ti++){
            var prod = pagina[ti], c = cadDe(prod);
            var proc = await prepImg(PASTA+prod.codigo+'.'+extDe(prod.codigo));
            var photo = proc ? '<img src="'+proc+'" alt="">' : '';
            var sem = proc ? '' : ' sem';
            tiles += '<div class="ax-tile"><div class="ax-photo'+sem+'">'+photo+'</div>'
              + '<div class="ax-info"><div class="ax-desc">'+(prod.descricao||'')+'</div>'
              + '<div class="ax-cod">'+(prod.codigo||'')+'</div>'
              + '<div class="ax-dados">'
              +   '<span><b>EAN</b>'+(prod.ean||c.EAN||'—')+'</span>'
              +   '<span><b>DUN</b>'+(c.DUN||'—')+'</span>'
              +   '<span><b>NCM</b>'+(c.NCM||'—')+'</span>'
              +   '<span><b>CX</b>'+(c.CAIXA||'—')+'</span>'
              + '</div></div></div>';
          }
          var bgStyle = bgUrl ? "background-image:url('"+bgUrl+"')" : "background:"+pal.pageBg;
          var vars = '--ax-accent:'+pal.accent+';--ax-dark:'+pal.dark+';--ax-border:'+pal.border
            +';--ax-chipbg:'+pal.chipbg+';--ax-label:'+pal.label+';--ax-val:'+pal.val
            +';--ax-kicker:'+pal.kicker+';--ax-footer:'+pal.footer;
          html += '<div class="ax-page" style="'+bgStyle+';'+vars+'">'
            + '<div class="ax-body">'
            +   '<div class="ax-header"><div class="ax-hcell">'+mlogoHtml+'</div>'
            +     '<div class="ax-headline"><div class="ax-kicker">CATÁLOGO DE PRODUTOS</div><div class="ax-linha">'+linha+'</div></div>'
            +     '<div class="ax-hcell right"><img class="ax-flogo" src="logo-ferretti.png" alt="Ferretti"></div></div>'
            +   '<div class="ax-divider"></div>'
            +   '<div class="ax-grid">'+tiles+'</div>'
            +   '<div class="ax-footer"><span>M. Ferretti Distribuidora</span><span>Pág. '+pNum+' / '+totalPags+'</span></div>'
            + '</div></div>';
        }
      }
      apresArea.innerHTML = html;
      load.classList.remove('on');
      document.body.classList.add('modo-apres');
      window.print();
    } catch(err){
      load.classList.remove('on');
      alert('Erro ao gerar a apresentação: '+err.message);
    }
  }

  window.addEventListener('afterprint', function(){
    document.body.classList.remove('modo-cad','modo-apres');
  });

  document.getElementById("btnXlsx").addEventListener("click", exportarXLSX);
  document.getElementById("btnPdf").addEventListener("click", exportarPDF);
  document.getElementById("btnApres").addEventListener("click", exportarApresentacao);
  document.getElementById("limparSel").addEventListener("click", function(){
    selecionados = {}; atualizaSelInfo(); render();
  });

  // Painel da lista de selecao
  var btnSelProdutos = document.getElementById("btnSelProdutos");
  var painelSel = document.getElementById("painelSel");
  btnSelProdutos.addEventListener("click", function(e){ e.stopPropagation(); painelSel.classList.toggle("open"); });
  document.addEventListener("click", function(e){
    if(painelSel.classList.contains("open") && !painelSel.contains(e.target)
       && e.target !== btnSelProdutos && !btnSelProdutos.contains(e.target)){
      painelSel.classList.remove("open");
    }
  });
  document.getElementById("selTodos").addEventListener("click", function(){
    filtrados.forEach(function(p){ selecionados[p.codigo] = true; });
    montaPainelSel(filtrados); atualizaSelInfo(); marcaCardsSelecionados();
  });
  document.getElementById("selNenhum").addEventListener("click", function(){
    selecionados = {}; montaPainelSel(filtrados); atualizaSelInfo(); marcaCardsSelecionados();
  });

  // Selo: data da ultima atualizacao dos DADOS/IMAGENS
  (function(){
    var el = document.getElementById("dadosVersao");
    if(el) el.textContent = window.DADOS_ATUALIZADOS ? ("Dados atualizados em " + window.DADOS_ATUALIZADOS) : "";
  })();

  // ===== Mapa marca → arquivo de logo (pasta marcas/) =====
  var MARCA_LOGO = {
    "AER":  "marcas/aeroflex.png",
    "BAB":  "marcas/baruel.png",
    "BEL":  "marcas/bellacoton.png",
    "BRI":  "marcas/brics.png",
    "CLO":  "marcas/cloy.png",
    "CRE":  "marcas/bellacoton.png",  // mesma logo BEL
    "DEN":  "marcas/dentics.png",
    "FAR":  "marcas/farnese.png",
    "GAL":  "marcas/galaxy.png",
    "KIN":  "marcas/king.png",
    "LEI":  "marcas/leite-de-rosas.png",
    "MUL":  "marcas/multionic.png",
    "NAT":  "marcas/nathan.png",
    "PRU":  "marcas/prudence.png",
    "SEM":  "marcas/semorin.png",
    "SHO":  "marcas/superfine.png",
    "SUS":  "marcas/sussex.png",
    "TEC":  "marcas/techluz.png",
    "TEN":  "marcas/baruel.png",
    "TENW": "marcas/baruel.png",
    "UNI":  "marcas/multionic.png",
    "WHI":  "marcas/orbi.png",
    "YAM":  "marcas/yama.png"
  };

  var lista = (typeof PRODUTOS !== "undefined") ? PRODUTOS.slice() : [];
  // So mostra produtos que tem imagem cadastrada (presente no manifesto).
  if(DISP){ lista = lista.filter(function(p){ return Object.prototype.hasOwnProperty.call(DISP, p.codigo); }); }

  // Ordena: MANTEM a ordem atual das marcas (1a aparicao) e, dentro de cada marca,
  // ordena por descricao -> agrupa produtos da mesma categoria/linha lado a lado
  // (tira manchas com tira manchas, yama babosa juntos, biocare juntos, etc.).
  (function ordenaPorCategoria(){
    var idxMarca = {}, n = 0;
    lista.forEach(function(p){
      var m = p.marca || "";
      if(!(m in idxMarca)){ idxMarca[m] = n++; }
    });
    lista.sort(function(a,b){
      var ma = a.marca || "", mb = b.marca || "";
      if(ma !== mb) return idxMarca[ma] - idxMarca[mb];
      return normaliza(a.descricao).localeCompare(normaliza(b.descricao), "pt-BR");
    });
  })();

  // Preenche os selects de fornecedor e marca a partir dos dados (ordenado)
  function preencheSelect(sel, valores){
    valores.sort(function(a,b){ return a.localeCompare(b, "pt-BR"); });
    valores.forEach(function(v){
      var o = document.createElement("option");
      o.value = v; o.textContent = v;
      sel.appendChild(o);
    });
  }
  (function montaFiltros(){
    var marcas = {};
    lista.forEach(function(p){ if(p.marca) marcas[p.marca] = true; });
    preencheSelect(selMarca, Object.keys(marcas));
  })();

  function render(){
    grid.innerHTML = "";
    var f = normaliza(busca.value);
    var fMarca = selMarca.value;
    var vis = lista.filter(function(p){
      if(fMarca && p.marca !== fMarca) return false;
      if(!f) return true;
      return normaliza(p.codigo).indexOf(f) > -1 ||
             normaliza(p.descricao).indexOf(f) > -1 ||
             normaliza(p.ean).indexOf(f) > -1 ||
             normaliza(p.fornecedor).indexOf(f) > -1 ||
             normaliza(p.marca).indexOf(f) > -1;
    });
    filtrados = vis;
    // Coerencia filtro<->selecao: descarta selecionados que sairam da tela
    // (ao trocar de marca ou quando a busca esconde itens), pra nada "invisivel"
    // entrar na exportacao.
    var visSet = {};
    vis.forEach(function(p){ visSet[p.codigo] = true; });
    Object.keys(selecionados).forEach(function(cod){ if(!visSet[cod]) delete selecionados[cod]; });
    var marcaAtual = null;
    vis.forEach(function(p){
      // Insere separador com logo uma única vez por grupo de marca
      if(p.marca !== marcaAtual){
        marcaAtual = p.marca;
        var logoSrc = MARCA_LOGO[p.marca];
        var sep = document.createElement("div");
        sep.className = "marca-sep";
        sep.innerHTML =
          '<div class="marca-sep-in">'
          + (logoSrc
              ? '<img class="marca-logo" src="'+logoSrc+'" alt="'+p.marca+'">'
              : '<span class="marca-cod">'+p.marca+'</span>')
          + '</div>'
          + (logoSrc
              ? '<a class="marca-dl" href="'+logoSrc+'" download title="Baixar logo '+p.marca+'">'
                + '<svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>'
                + 'logo</a>'
              : '');
        grid.appendChild(sep);
      }
      criaCard(p);
    });
    vazio.style.display = vis.length ? "none" : "block";
    contador.textContent = vis.length + " de " + lista.length + " produto(s)";
    btnLimpar.style.display = (f || fMarca) ? "inline" : "none";
    montaPainelSel(vis);
    atualizaSelInfo();
  }

  var t;
  busca.addEventListener("input", function(){
    clearTimeout(t);
    t = setTimeout(render, 120);
  });
  selMarca.addEventListener("change", function(){ selecionados = {}; render(); });
  btnLimpar.addEventListener("click", function(){
    busca.value = ""; selMarca.value = "";
    render();
  });

  render();
</script>

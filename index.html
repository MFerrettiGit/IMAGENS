<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banco de Imagens — M. Ferretti</title>
<style>
  :root{
    --azul:#0d3b66;
    --azul-claro:#1d5d99;
    --cinza:#f2f4f7;
    --borda:#e1e5ea;
    --texto:#1c2733;
    --suave:#6b7785;
    --amarelo:#ffd23f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--cinza);
    color:var(--texto);
  }
  header{
    background:linear-gradient(135deg,var(--azul),var(--azul-claro));
    color:#fff;
    padding:24px 20px 20px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  .header-top{
    max-width:1200px;margin:0 auto;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .logo-img{height:46px;width:auto;display:block;flex:0 0 auto}
  .titulo h1{font-size:22px;font-weight:700;line-height:1.1}
  .titulo p{font-size:13px;opacity:.85;margin-top:2px}
  .controles{max-width:1200px;margin:18px auto 0;display:flex;flex-wrap:wrap;gap:10px}
  .busca-wrap{position:relative;flex:1 1 260px}
  #busca{
    width:100%;padding:13px 44px 13px 16px;border:none;border-radius:10px;
    font-size:16px;outline:none;box-shadow:0 2px 8px rgba(0,0,0,.12);
  }
  .busca-wrap svg{
    position:absolute;right:14px;top:50%;transform:translateY(-50%);
    width:20px;height:20px;fill:var(--suave);pointer-events:none;
  }
  .filtro{
    flex:0 1 220px;padding:13px 14px;border:none;border-radius:10px;
    font-size:15px;outline:none;box-shadow:0 2px 8px rgba(0,0,0,.12);
    background:#fff;color:var(--texto);cursor:pointer;
  }
  main{max-width:1200px;margin:0 auto;padding:22px 20px 60px}
  .barra-info{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .contador{font-size:13px;color:var(--suave)}
  .limpar{font-size:13px;color:var(--azul-claro);background:none;border:none;cursor:pointer;text-decoration:underline}
  .grid{
    display:grid;gap:18px;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  }
  .card{
    background:#fff;border:1px solid var(--borda);border-radius:14px;
    overflow:hidden;display:flex;flex-direction:column;
    transition:transform .12s ease,box-shadow .12s ease;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(13,59,102,.12)}
  .img-box{
    aspect-ratio:1/1;background:#fafbfc;display:flex;align-items:center;justify-content:center;
    border-bottom:1px solid var(--borda);overflow:hidden;cursor:zoom-in;position:relative;
  }
  .img-box img{width:100%;height:100%;object-fit:contain}
  .sem-img{color:var(--suave);font-size:13px;text-align:center;padding:10px}
  .marca-badge{
    position:absolute;top:8px;left:8px;background:var(--azul);color:#fff;
    font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.3px;
  }
  .info{padding:12px 14px;flex:1;display:flex;flex-direction:column;gap:5px}
  .cod{font-size:12px;font-weight:700;color:var(--azul-claro);letter-spacing:.3px}
  .desc{font-size:14px;font-weight:600;line-height:1.25;flex:1}
  .ean{font-size:12px;color:var(--suave);font-variant-numeric:tabular-nums}
  .forn{font-size:11px;color:var(--suave);text-transform:uppercase;letter-spacing:.2px}
  .baixar{
    margin:0 14px 8px;padding:10px;border:none;border-radius:9px;cursor:pointer;
    background:var(--azul);color:#fff;font-size:14px;font-weight:600;
    display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;
    transition:background .12s ease;
  }
  .baixar:hover{background:var(--azul-claro)}
  .baixar.disabled{background:#c7ccd2;cursor:not-allowed;pointer-events:none}
  .baixar svg{width:16px;height:16px;fill:#fff}
  .vazio{text-align:center;color:var(--suave);padding:60px 20px;font-size:15px}
  /* Botao dados cadastrais */
  .dados-btn{
    margin:0 14px 14px;padding:9px;border:1px solid var(--azul);border-radius:9px;cursor:pointer;
    background:#fff;color:var(--azul);font-size:13px;font-weight:600;
    display:flex;align-items:center;justify-content:center;gap:7px;transition:background .12s ease;
  }
  .dados-btn:hover{background:#eef3f9}
  .dados-btn svg{width:15px;height:15px;fill:var(--azul)}
  /* Modal dados cadastrais (layout igual ao site de cadastro) */
  #dadosModal{position:fixed;inset:0;background:rgba(10,20,30,.55);display:none;z-index:60;overflow:auto;padding:24px 14px}
  #dadosModal.open{display:block}
  .dc-wrap{max-width:760px;margin:0 auto}
  .dc-close{position:sticky;top:0;display:flex;justify-content:flex-end;margin-bottom:8px}
  .dc-close button{background:#fff;border:none;border-radius:50%;width:38px;height:38px;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2);color:var(--texto)}
  .dc-card{background:#fff;border-radius:12px;box-shadow:0 6px 30px rgba(0,0,0,.25);overflow:hidden;border:1px solid var(--borda)}
  .dc-top{background:var(--azul);color:#fff;padding:12px 16px}
  .dc-top .dc-cod{font-size:.76rem;opacity:.85;letter-spacing:.5px}
  .dc-top .dc-desc{font-size:1.1rem;font-weight:700;line-height:1.2;margin-top:2px}
  .dc-top .dc-marca{display:inline-block;margin-top:6px;background:rgba(255,255,255,.2);padding:2px 9px;border-radius:20px;font-size:.76rem;font-weight:600}
  .dc-bloco{padding:9px 16px;border-top:1px solid var(--borda)}
  .dc-bloco h3{font-size:.7rem;text-transform:uppercase;letter-spacing:.6px;color:var(--azul);margin-bottom:6px;font-weight:700}
  .dc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px}
  .dc-grid.full{grid-template-columns:1fr}
  .dc-campo .dc-rotulo{font-size:.68rem;color:var(--suave);text-transform:uppercase;letter-spacing:.2px}
  .dc-campo .dc-valor{font-size:.95rem;font-weight:600;line-height:1.2;word-break:break-word}
  .dc-campo .dc-valor.vazio{color:#aab;font-weight:400}
  .dc-indisp{padding:40px 20px;text-align:center;color:var(--suave)}
  /* Lightbox */
  #lightbox{
    position:fixed;inset:0;background:rgba(10,20,30,.9);display:none;
    align-items:center;justify-content:center;z-index:50;padding:20px;cursor:zoom-out;
  }
  #lightbox img{max-width:92vw;max-height:82vh;object-fit:contain;border-radius:8px;background:#fff}
  #lightbox .lb-bar{position:absolute;bottom:24px;display:flex;gap:12px}
  #lightbox .lb-bar a{
    background:var(--azul);color:#fff;text-decoration:none;padding:10px 18px;border-radius:9px;
    font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;
  }
  #lightbox .lb-bar a svg{width:16px;height:16px;fill:#fff}
  footer{text-align:center;color:var(--suave);font-size:12px;padding:24px}
</style>
</head>
<body>
<header>
  <div class="header-top">
    <img class="logo-img" src="logo-ferretti.png" alt="Ferretti distribuidora">
    <div class="titulo">
      <h1>Banco de Imagens</h1>
      <p>Fotos de produtos para a equipe de vendas</p>
    </div>
  </div>
  <div class="controles">
    <div class="busca-wrap">
      <input id="busca" type="search" placeholder="Pesquisar por código, descrição ou EAN..." autocomplete="off">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
    </div>
    <select id="filtroMarca" class="filtro"><option value="">Todas as marcas</option></select>
  </div>
</header>

<main>
  <div class="barra-info">
    <span class="contador" id="contador"></span>
    <button class="limpar" id="limpar" style="display:none">Limpar filtros</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="vazio" id="vazio" style="display:none">Nenhum produto encontrado.</div>
</main>

<div id="dadosModal">
  <div class="dc-wrap">
    <div class="dc-close"><button type="button" id="dcFechar" aria-label="Fechar">&times;</button></div>
    <div id="dcConteudo"></div>
  </div>
</div>

<div id="lightbox">
  <img id="lb-img" src="" alt="">
  <div class="lb-bar">
    <a id="lb-baixar" href="#" download>
      <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      Baixar imagem
    </a>
  </div>
</div>

<footer>M. Ferretti · Banco de Imagens de Produtos</footer>

<script src="produtos.js"></script>
<script src="cadastro.js"></script>
<script>
  // Extensões tentadas para cada imagem (a foto é nomeada pelo CÓDIGO do produto)
  var EXTENSOES = ["jpg","jpeg","png","webp"];
  var PASTA = "imagens/";

  var grid = document.getElementById("grid");
  var vazio = document.getElementById("vazio");
  var contador = document.getElementById("contador");
  var busca = document.getElementById("busca");
  var selMarca = document.getElementById("filtroMarca");
  var btnLimpar = document.getElementById("limpar");
  var lightbox = document.getElementById("lightbox");
  var lbImg = document.getElementById("lb-img");
  var lbBaixar = document.getElementById("lb-baixar");

  function normaliza(s){
    return (s || "").toString().toLowerCase()
      .normalize("NFD").replace(/[̀-ͯ]/g,"");
  }

  // Tenta carregar a imagem testando cada extensão; ao achar, atualiza card e download.
  function resolveImagem(card, codigo){
    var imgBox = card.querySelector(".img-box");
    var img = imgBox.querySelector("img");
    var botao = card.querySelector(".baixar");
    var i = 0;
    function tenta(){
      if(i >= EXTENSOES.length){
        imgBox.querySelector(".sem-img") || (function(){
          var s = document.createElement("span");
          s.className = "sem-img";
          s.innerHTML = "Sem imagem<br>cadastrada";
          img.style.display = "none";
          imgBox.appendChild(s);
        })();
        imgBox.style.cursor = "default";
        botao.classList.add("disabled");
        botao.textContent = "Sem imagem";
        return;
      }
      var url = PASTA + codigo + "." + EXTENSOES[i];
      var teste = new Image();
      teste.onload = function(){
        img.src = url;
        botao.href = url;
        botao.setAttribute("download", codigo + "." + EXTENSOES[i]);
        imgBox.onclick = function(){ abreLightbox(url, codigo + "." + EXTENSOES[i]); };
      };
      teste.onerror = function(){ i++; tenta(); };
      teste.src = url;
    }
    tenta();
  }

  function criaCard(p){
    var card = document.createElement("div");
    card.className = "card";
    var marca = p.marca ? '<span class="marca-badge">' + p.marca + '</span>' : '';
    card.innerHTML =
      '<div class="img-box">' + marca + '<img alt="' + (p.descricao||"") + '"></div>' +
      '<div class="info">' +
        '<span class="cod">COD ' + (p.codigo||"") + '</span>' +
        '<span class="desc">' + (p.descricao||"") + '</span>' +
        '<span class="ean">EAN: ' + (p.ean || "—") + '</span>' +
        '<span class="forn">' + (p.fornecedor || "") + '</span>' +
      '</div>' +
      '<a class="baixar" href="#"><svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>Baixar imagem</a>' +
      '<button class="dados-btn" type="button"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>Dados cadastrais</button>';
    grid.appendChild(card);
    card.querySelector(".dados-btn").addEventListener("click", function(){ abreDados(p.codigo); });
    resolveImagem(card, p.codigo);
    return card;
  }

  function abreLightbox(url, nome){
    lbImg.src = url;
    lbBaixar.href = url;
    lbBaixar.setAttribute("download", nome);
    lightbox.style.display = "flex";
  }
  lightbox.addEventListener("click", function(e){
    if(e.target === lbBaixar || lbBaixar.contains(e.target)) return;
    lightbox.style.display = "none";
    lbImg.src = "";
  });

  // ===== Dados cadastrais (modal com layout igual ao site de cadastro) =====
  var CAD = {};
  (window.CADASTRO || []).forEach(function(p){ if(p && p.CODIGO) CAD[p.CODIGO] = p; });
  var dadosModal = document.getElementById("dadosModal");
  var dcConteudo = document.getElementById("dcConteudo");

  function dcV(x){ if(x===null||x===undefined||x==='') return '<span class="dc-valor vazio">—</span>'; return '<span class="dc-valor">'+String(x)+'</span>'; }
  function dcVs(x,suf){ if(x===null||x===undefined||x==='') return '<span class="dc-valor vazio">—</span>'; return '<span class="dc-valor">'+String(x)+(suf?' '+suf:'')+'</span>'; }
  function dcCampo(r,html){ return '<div class="dc-campo"><div class="dc-rotulo">'+r+'</div>'+html+'</div>'; }
  function dcPalet(p){ return (p.PALETE_LASTRO&&p.PALETE_ALT)?(p.PALETE_LASTRO+' × '+p.PALETE_ALT+' = '+(p.PALETE_LASTRO*p.PALETE_ALT)+' cx/palete'):(p.PALETE_LASTRO||p.PALETE_ALT||''); }
  function dcCard(p){
    return '<div class="dc-card">'
      + '<div class="dc-top"><div class="dc-cod">CÓD. '+(p.CODIGO||'—')+'</div>'
      +   '<div class="dc-desc">'+(p.DESCRICAO||'Sem descrição')+'</div>'
      +   (p.MARCA?'<span class="dc-marca">'+p.MARCA+'</span>':'')+'</div>'
      + '<div class="dc-bloco"><h3>Identificação</h3><div class="dc-grid">'
      +   dcCampo('Fornecedor',dcV(p.FORNECEDOR))+dcCampo('Marca',dcV(p.MARCA))
      +   dcCampo('Código',dcV(p.CODIGO))+dcCampo('Referência',dcV(p.REFERENCIA))
      + '</div><div class="dc-grid full" style="margin-top:7px">'+dcCampo('Descrição',dcV(p.DESCRICAO))+'</div></div>'
      + '<div class="dc-bloco"><h3>Códigos de barras</h3><div class="dc-grid">'
      +   dcCampo('EAN (unidade)',dcV(p.EAN))+dcCampo('DUN (caixa)',dcV(p.DUN))+'</div></div>'
      + '<div class="dc-bloco"><h3>Embalagem</h3><div class="dc-grid">'
      +   dcCampo('Qtde por caixa',dcV(p.CAIXA))+dcCampo('Lote mínimo',dcV(p.LOTE_MINIMO))
      +   dcCampo('Validade',dcV(p.VALIDADE))+dcCampo('Paletização',dcV(dcPalet(p)))+'</div></div>'
      + '<div class="dc-bloco"><h3>Fiscal</h3><div class="dc-grid">'
      +   dcCampo('NCM',dcV(p.NCM))+dcCampo('CEST',dcV(p.CEST))+dcCampo('CFOP',dcV(p.CFOP))+dcCampo('CST',dcV(p.CST))
      +   dcCampo('IVA entrada',dcV(p.IVA_ENTRADA))+dcCampo('IVA saída',dcV(p.IVA_SAIDA))
      +   dcCampo('ICMS',dcV(p.ICMS))+dcCampo('IPI',dcV(p.IPI))+dcCampo('Origem',dcV(p.ORIGEM))
      + '</div><div class="dc-grid full" style="margin-top:7px">'+dcCampo('PIS/COFINS',dcV(p.PIS_COFINS))+'</div></div>'
      + '<div class="dc-bloco"><h3>Logística — Item</h3><div class="dc-grid">'
      +   dcCampo('Peso bruto',dcVs(p.ITEM_PESO_BRUTO,p.ITEM_UN_PESO||'kg'))+dcCampo('Peso líquido',dcVs(p.ITEM_PESO_LIQ,p.ITEM_UN_PESO||'kg'))
      +   dcCampo('Altura',dcVs(p.ITEM_A,p.ITEM_UN_DIM||'cm'))+dcCampo('Comprimento',dcVs(p.ITEM_C,p.ITEM_UN_DIM||'cm'))
      +   dcCampo('Largura',dcVs(p.ITEM_L,p.ITEM_UN_DIM||'cm'))+'</div></div>'
      + '<div class="dc-bloco"><h3>Logística — Caixa</h3><div class="dc-grid">'
      +   dcCampo('Peso bruto',dcVs(p.CAIXA_PESO_BRUTO,p.CAIXA_UN_PESO||'kg'))+dcCampo('Peso líquido',dcVs(p.CAIXA_PESO_LIQ,p.CAIXA_UN_PESO||'kg'))
      +   dcCampo('Altura',dcVs(p.CAIXA_A,p.CAIXA_UN_DIM||'cm'))+dcCampo('Comprimento',dcVs(p.CAIXA_C,p.CAIXA_UN_DIM||'cm'))
      +   dcCampo('Largura',dcVs(p.CAIXA_L,p.CAIXA_UN_DIM||'cm'))+'</div></div>'
      + '</div>';
  }
  function abreDados(codigo){
    var p = CAD[codigo];
    if(p){ dcConteudo.innerHTML = dcCard(p); }
    else { dcConteudo.innerHTML = '<div class="dc-card"><div class="dc-top"><div class="dc-cod">CÓD. '+codigo+'</div><div class="dc-desc">Dados cadastrais indisponíveis</div></div><div class="dc-indisp">Este produto ainda não está na base de dados cadastrais.</div></div>'; }
    dadosModal.classList.add("open");
    dadosModal.scrollTop = 0;
  }
  function fechaDados(){ dadosModal.classList.remove("open"); dcConteudo.innerHTML = ""; }
  document.getElementById("dcFechar").addEventListener("click", fechaDados);
  dadosModal.addEventListener("click", function(e){ if(e.target === dadosModal) fechaDados(); });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") fechaDados(); });

  var lista = (typeof PRODUTOS !== "undefined") ? PRODUTOS.slice() : [];

  // Preenche os selects de fornecedor e marca a partir dos dados (ordenado)
  function preencheSelect(sel, valores){
    valores.sort(function(a,b){ return a.localeCompare(b, "pt-BR"); });
    valores.forEach(function(v){
      var o = document.createElement("option");
      o.value = v; o.textContent = v;
      sel.appendChild(o);
    });
  }
  (function montaFiltros(){
    var marcas = {};
    lista.forEach(function(p){ if(p.marca) marcas[p.marca] = true; });
    preencheSelect(selMarca, Object.keys(marcas));
  })();

  function render(){
    grid.innerHTML = "";
    var f = normaliza(busca.value);
    var fMarca = selMarca.value;
    var vis = lista.filter(function(p){
      if(fMarca && p.marca !== fMarca) return false;
      if(!f) return true;
      return normaliza(p.codigo).indexOf(f) > -1 ||
             normaliza(p.descricao).indexOf(f) > -1 ||
             normaliza(p.ean).indexOf(f) > -1 ||
             normaliza(p.fornecedor).indexOf(f) > -1 ||
             normaliza(p.marca).indexOf(f) > -1;
    });
    vis.forEach(criaCard);
    vazio.style.display = vis.length ? "none" : "block";
    contador.textContent = vis.length + " de " + lista.length + " produto(s)";
    btnLimpar.style.display = (f || fMarca) ? "inline" : "none";
  }

  var t;
  busca.addEventListener("input", function(){
    clearTimeout(t);
    t = setTimeout(render, 120);
  });
  selMarca.addEventListener("change", render);
  btnLimpar.addEventListener("click", function(){
    busca.value = ""; selMarca.value = "";
    render();
  });

  render();
</script>
</body>
</html>
